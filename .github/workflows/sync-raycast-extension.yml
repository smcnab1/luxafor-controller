name: Review historical Raycast branch differences

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report differences without changing main
        run: |
          git diff --stat origin/main origin/raycast-extension
          echo 'Historical comparison only. Reconcile accepted upstream files using RELEASE_CHECKLIST.md; this workflow never pushes.'
